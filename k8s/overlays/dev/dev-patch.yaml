# JSON 6902 rather than a strategic merge patch: this applies to both Jobs via
# `target: kind: Job`, and a merge patch would need a metadata.name that can
# only match one of them.
#
# Note this patches container 0 only. On mathgraph-bench that is the `bench`
# container -- initContainers are a separate list and keep their own (tiny)
# sizing, which is what we want.
- op: replace
  path: /spec/template/spec/containers/0/imagePullPolicy
  value: Always
- op: replace
  path: /spec/backoffLimit
  value: 1
- op: replace
  path: /spec/template/spec/containers/0/resources/requests/cpu
  value: 500m
- op: replace
  path: /spec/template/spec/containers/0/resources/requests/memory
  value: 1Gi
- op: replace
  path: /spec/template/spec/containers/0/resources/limits/cpu
  value: "1"
- op: replace
  path: /spec/template/spec/containers/0/resources/limits/memory
  value: 2Gi
