description = """
mathgraph work formula: mol-do-work plus this city's main-only rule.

The worker does the bead in its own detached worktree on the tip of
`origin/main`, commits, rebases and pushes straight to `main`, closes the bead
and mails the mayor. No branches, no PRs (owner decision 2026-11-20).

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| convoy_id | runtime | Input convoy tracking the single work bead |
| escalation_target | caller | Mail recipient for blocked work (default: `mayor`) |
"""
formula = "mol-main-work"

[requires]
formula_compiler = ">=2.0.0"

[vars.escalation_target]
description = "Mail recipient for blocked work and for the done notice."
default = "mayor"

[[steps]]
id = "do-work"
title = "Read assignment, implement, verify, commit, and close"
description = """
You have been assigned a work bead. Read it, do the work, verify it,
commit relevant changes, and close it.

**1. Read your assignment:**

Derive the work bead from the input convoy, then read it:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-main-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd show "$WORK_BEAD_ID"
```

Read the bead's title and description carefully. This is your task.

**Claim it and signal liveness:** the input-convoy child derived above is not
claimed by the routing step that assigned you — claim it explicitly before your
first heartbeat:
```bash
gc bd update "$WORK_BEAD_ID" --claim
```
`--claim` is idempotent and self-assigns regardless of current state, so this is
safe even if the bead was already claimed some other way. Then run
`gc bd heartbeat "$WORK_BEAD_ID"` now, and again before any shell command you
expect to run for many minutes (long builds, test sweeps). It refreshes your
claim's lease so the dashboard can tell you are alive and working rather than
wedged. If a heartbeat ever fails, your claim was reclaimed or closed out from
under you — stop working this bead immediately.

Read the bead's notes too: the mayor's dispatch note there names the repo,
the branch to start from, pointers and the verification to run, and it
overrides the defaults below.

**2. Set up a detached worktree on the tip of main. Never edit the main checkout:**

mathgraph works on `main` only: no branches, no PRs. Each worker gets its own
detached worktree so parallel workers do not collide, commits there, and lands
its commits on `origin/main` by rebase + fast-forward push.
```bash
REPO=$(git rev-parse --show-toplevel)
WT="$REPO/.claude/worktrees/$WORK_BEAD_ID/$(basename "$REPO")"
git -C "$REPO" fetch origin
[ -d "$WT" ] || git -C "$REPO" worktree add --detach "$WT" origin/main
cd "$WT"
```

**Rules for every mathgraph worker:**
- Never create branches. Commit on the detached HEAD of your worktree and push
  only with `git push origin HEAD:main` after rebasing onto `origin/main`.
  Never force-push, never rewrite pushed history, never touch other workers'
  worktrees.
- No deploys, publishing (PyPI, arXiv, GitHub releases), email or messages to
  people, and no paid API calls (skip tests that make them).
- Python: create any venv inside your worktree, assert
  `sys.prefix != sys.base_prefix` before installing into it, and never
  `uv sync` or pip-install into an env outside the worktree. Large shared data
  lives in the main checkout's `mathgraph-data/`; point `MATHGRAPH_DATA` at it
  and treat it as read-only unless the bead says otherwise.
- Keep compute bounded. If a run would take more than about two hours, run a
  smaller configuration that answers the question and record what the full
  run would need. The Mac has 16 GB; other workers run concurrently.
- Experiments: commit the pre-registration (kill test, thresholds, analysis)
  before looking at outcome numbers, and report the result either way.
- Bead bookkeeping goes in this work bead's notes.

**3. Implement the solution and verify it:**

Do exactly what the bead describes. Follow existing codebase conventions and
the repo's AGENTS.md / CLAUDE.md, including its test command. Run the
verification the dispatch note names, else the smallest relevant test run.

Before closing, inspect the working tree:
```bash
git status --short
```

Commit, then land on main (run the full test suite first; retry the rebase if
the push loses a race):
```bash
git add <files>
git commit -m "<type>: <description> ($WORK_BEAD_ID)"
for i in 1 2 3; do
  git fetch origin && git rebase origin/main && git push origin HEAD:main && break
done
```
If the rebase conflicts, resolve it, re-run the tests, and push. If you cannot,
report blocked with the commit SHA.

Do not commit unrelated runtime metadata, local agent directories, caches, or
bead database churn unless the bead explicitly required those files.

**4. Close the target bead when done:**

Record the typed work-record outcome (ADR-0009) on the work bead so eval and
audit can trace work → artifact → outcome. Choose `gc.work_outcome` from what
actually happened:
- `shipped` — you pushed a change to main that satisfies the bead. Supply
  `gc.work_commit` (the SHA on main) and `gc.work_branch=main`.
- `no-op` — the bead needed no change (already satisfied / duplicate); omit
  `gc.work_commit` and `gc.work_branch`.
- `blocked` / `abandoned` — you could not complete it (also mail `{{escalation_target}}`).

`gc.outcome=pass` stays — it is the control-plane step result and is disjoint
from `gc.work_outcome`.

**Shipped** (you committed a change):
```bash
COMMIT=$(git rev-parse HEAD 2>/dev/null || true)
WORK_BRANCH=main
git merge-base --is-ancestor "$COMMIT" origin/main || { echo "commit not on origin/main yet" >&2; exit 1; }
gc bd update "$WORK_BEAD_ID" \
  --set-metadata gc.outcome=pass \
  --set-metadata gc.work_outcome=shipped \
  --set-metadata gc.work_commit="$COMMIT" \
  --set-metadata gc.work_branch="$WORK_BRANCH" \
  --set-metadata gc.work_verification="<commands you ran>" \
  --status=closed \
  --append-notes "Done: <what you did and found>. Verification: <commands run and results>. Pushed to main at ${COMMIT:-none}. Open questions: <or none>."
gc mail send {{escalation_target}} -s "DONE $WORK_BEAD_ID" -m "main at $COMMIT. <one-line summary>"
```

Then remove your worktree. Everything in it is on main or rebuildable (venvs,
caches); if `git status --porcelain` shows anything untracked that is not, copy
it into the main checkout's `mathgraph-data/` first:
```bash
cd "$REPO"
git -C "$WT" status --porcelain
git worktree remove --force "$WT" && rmdir "$(dirname "$WT")" 2>/dev/null || true
```

**No-op** (the bead needed no change — already satisfied / duplicate):
```bash
gc bd update "$WORK_BEAD_ID" \
  --set-metadata gc.outcome=pass \
  --set-metadata gc.work_outcome=no-op \
  --status=closed \
  --append-notes "No-op: <why no change was needed>."
gc mail send {{escalation_target}} -s "NO-OP $WORK_BEAD_ID" -m "<why>"
```

**Blocked** (you cannot finish: frozen, needs a human decision, needs cloud
access, or a failure you cannot resolve). Commit any useful partial work
first, then leave the bead open for the mayor:
```bash
gc bd update "$WORK_BEAD_ID" \
  --set-metadata gc.work_outcome=blocked \
  --status=blocked \
  --append-notes "BLOCKED: <why, what you tried, what is committed where>."
gc mail send {{escalation_target}} -s "BLOCKED $WORK_BEAD_ID" -m "<why>"
```

**5. Close this formula step:**

If `GC_BEAD_ID` is set and is different from `$WORK_BEAD_ID`, close it too. This
prevents `mol-main-work` wrapper beads from remaining ready after the real work
is complete.
```bash
if [ -n "${GC_BEAD_ID:-}" ] && [ "$GC_BEAD_ID" != "$WORK_BEAD_ID" ]; then
  gc bd update "$GC_BEAD_ID" --set-metadata gc.outcome=pass --status=closed --notes "Target $WORK_BEAD_ID completed. Commit: ${COMMIT:-none}."
fi
```

If you get stuck or need clarification, check your inbox:
```bash
gc mail inbox
```

**Exit criteria:** The work described in the bead is complete, relevant changes
are committed, the target bead is closed, and the claimed formula step is
closed when `GC_BEAD_ID` is available."""

[[steps]]
id = "drain"
title = "Close drain step and signal completion"
needs = ["do-work"]
description = """
Work is done. Close this drain step, then signal the controller to reclaim this
session:

```bash
DRAIN_BEAD_ID=""
ROOT_BEAD_ID=""
CURRENT_ID=$(gc hook current --id-only 2>/dev/null || true)
if [ -n "$CURRENT_ID" ]; then
  CURRENT=$(gc bd show "$CURRENT_ID" --json) || exit 1
  DRAIN_BEAD_ID=$(printf '%s' "$CURRENT" | jq -r '(if type == "array" then .[0] else . end) | select(.status != "closed") | select(.metadata["gc.step_ref"] == "mol-main-work.drain") | .id // empty')
  ROOT_BEAD_ID=$(printf '%s' "$CURRENT" | jq -r '(if type == "array" then .[0] else . end) | .metadata["gc.root_bead_id"] // empty')
fi
if [ -z "$DRAIN_BEAD_ID" ]; then
  if [ -z "$ROOT_BEAD_ID" ]; then
    STARTUP_BEAD_ID="${GC_BEAD_ID:-${GC_TRIGGER_BEAD_ID:-}}"
    if [ -z "$STARTUP_BEAD_ID" ]; then
      echo "mol-main-work drain resolved no continuation from the current claim and has no startup bead id to fall back on" >&2
      exit 1
    fi
    STARTUP_BEAD=$(gc bd show "$STARTUP_BEAD_ID" --json) || exit 1
    ROOT_BEAD_ID=$(printf '%s' "$STARTUP_BEAD" | jq -r '(if type == "array" then .[0] else . end) | .metadata["gc.root_bead_id"] // empty')
  fi
  if [ -z "$ROOT_BEAD_ID" ]; then
    echo "mol-main-work drain could not resolve its workflow root from the current claim or a startup bead id" >&2
    exit 1
  fi
  READY_BEADS=$(gc ready --json --limit=2 --include-ephemeral --metadata-field "gc.root_bead_id=$ROOT_BEAD_ID" --metadata-field "gc.step_ref=mol-main-work.drain") || exit 1
  DRAIN_BEAD_ID=$(printf '%s' "$READY_BEADS" | jq -r 'if length == 1 then .[0].id else empty end')
  if [ -z "$DRAIN_BEAD_ID" ]; then
    echo "mol-main-work drain could not resolve one ready continuation bead for root $ROOT_BEAD_ID" >&2
    exit 1
  fi
fi
gc bd update "$DRAIN_BEAD_ID" --set-metadata gc.outcome=pass --status=closed --notes "Drain acknowledged." || exit 1
gc runtime drain-ack
```

Run exactly these commands and nothing else."""
