[project]
name = "mathgraph"
version = "0.1.0"
description = "Align informal mathematical papers to formal library declarations, with calibrated abstention"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Only needed to re-run the training experiments; the retrieval and
# verification paths need numpy alone.
train = []

[project.scripts]
mathgraph = "mathgraph.cli:main"

[project.urls]
Homepage = "https://github.com/YOURNAME/mathgraph"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathgraph"]

[tool.uv]
# Corpus artifacts are large and rebuilt locally by `mathgraph setup`;
# they are never packaged into the wheel.
package = true
